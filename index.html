<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Tools Directory</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-hover: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --border-color: #334155;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
        max-width: 600px;
      }

      header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      .search-container {
        margin-bottom: 32px;
        width: 100%;
        max-width: 800px;
      }

      .search-input {
        width: 100%;
        padding: 14px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-primary);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 800px;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        background-color: var(--card-hover);
        border-color: var(--accent);
        box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card-icon {
        font-size: 2rem;
        background: rgba(56, 189, 248, 0.1);
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .card-description {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 20px;
        flex-grow: 1;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .tag {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-secondary);
      }

      .launch-btn {
        color: var(--accent);
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .card:hover .launch-btn {
        color: #fff;
      }

      .no-results {
        display: none;
        color: var(--text-secondary);
        text-align: center;
        grid-column: 1 / -1;
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🧰 HTML Tools Hub</h1>
      <p>Select a tool to launch</p>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tools..." />
    </div>

    <div class="grid" id="toolsGrid">
      <a href="./music-shuffle/music-shuffle.html" class="card" data-title="Music Shuffle Player Audio" data-desc="Play random audio tracks from your local music folder with shuffle and playback controls.">
        <div>
          <div class="card-header">
            <div class="card-icon">🎵</div>
            <h2 class="card-title">Music Shuffle</h2>
          </div>
          <p class="card-description">Play random audio tracks from a local music folder with shuffle and playback controls.</p>
        </div>
        <div class="card-footer">
          <span class="tag">Audio</span>
          <span class="launch-btn">Open &rarr;</span>
        </div>
      </a>
    </div>

    <div id="noResults" class="no-results">No matching tools found.</div>

    <script>
      const searchInput = document.getElementById('searchInput');
      const cards = document.querySelectorAll('.card');
      const noResults = document.getElementById('noResults');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        let visibleCount = 0;

        cards.forEach((card) => {
          const title = card.getAttribute('data-title').toLowerCase();
          const desc = card.getAttribute('data-desc').toLowerCase();
          if (title.includes(query) || desc.includes(query)) {
            card.style.display = 'flex';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      });
    </script>
  </body>
</html>
