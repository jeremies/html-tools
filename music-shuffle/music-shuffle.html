<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Music Player</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 60px auto;
        padding: 20px;
        background: #111;
        color: #eee;
        text-align: center;
      }
      button {
        font-size: 16px;
        padding: 12px 20px;
        margin: 8px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      #pick {
        background: #4caf50;
        color: white;
      }
      #prev,
      #next {
        background: #2196f3;
        color: white;
      }
      #shuffle {
        background: #ff9800;
        color: white;
      }
      #stop {
        background: #e53935;
        color: white;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      audio {
        width: 100%;
        margin: 25px 0;
      }

      #track {
        margin: 20px 0;
        min-height: 24px;
        color: #aaa;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Random Music Player</h1>

    <button id="pick">Choose Music Folder</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;" />
    <button id="prev" disabled>⏮ Prev</button>
    <button id="next" disabled>⏭ Next</button>
    <button id="shuffle" disabled>🔀 Shuffle</button>
    <button id="stop" disabled>⏹ Stop</button>

    <audio id="player" controls></audio>

    <div id="track">No folder selected</div>
    <script src="music-shuffle.js"></script>
    <script>
      (() => {
        const $ = (sel) => document.querySelector(sel);
        const FADE_DURATION = 5000; // 5 seconds cinematic transition

        let isFading = false; // false | 'in' | 'out'
        let fadeAnimId = null;
        let programmaticStateChange = false;

        const media = $("audio, video");
        let baseVolume = media ? media.volume : 0.15;
        let lastSetVolume = baseVolume;

        function cancelFade() {
          if (!isFading) return;
          if (fadeAnimId) {
            cancelAnimationFrame(fadeAnimId);
            fadeAnimId = null;
          }
          isFading = false;
          if (media) {
            media.volume = baseVolume;
            lastSetVolume = baseVolume;
          }
        }

        function fadeOutAndPause() {
          if (!media || (!media.src && !media.currentSrc)) return;
          if (media.paused && isFading !== "in") return;
          if (isFading === "out") return;

          if (fadeAnimId) {
            cancelAnimationFrame(fadeAnimId);
            fadeAnimId = null;
          }

          isFading = "out";
          const startVol = media.volume;
          const startTime = performance.now();

          function step(now) {
            if (isFading !== "out") return;
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / FADE_DURATION);
            const factor = (1 + Math.cos(Math.PI * t)) / 2; // 1 down to 0 cosine ease
            const newVol = Math.max(0, Math.min(1, startVol * factor));
            lastSetVolume = newVol;
            media.volume = newVol;

            if (t < 1) {
              fadeAnimId = requestAnimationFrame(step);
            } else {
              programmaticStateChange = true;
              media.pause();
              media.volume = baseVolume;
              lastSetVolume = baseVolume;
              programmaticStateChange = false;
              isFading = false;
              fadeAnimId = null;
            }
          }
          fadeAnimId = requestAnimationFrame(step);
        }

        function fadeInAndPlay() {
          if (!media || (!media.src && !media.currentSrc)) return;
          if (!media.paused && isFading !== "out") return;
          if (isFading === "in") return;

          if (fadeAnimId) {
            cancelAnimationFrame(fadeAnimId);
            fadeAnimId = null;
          }

          const targetVol = baseVolume > 0 ? baseVolume : 0.15;
          const startVol = media.paused ? 0 : media.volume;

          isFading = "in";
          media.volume = startVol;
          lastSetVolume = startVol;

          if (media.paused) {
            programmaticStateChange = true;
            const playPromise = media.play();
            programmaticStateChange = false;
            if (playPromise) {
              playPromise.catch(() => {
                cancelFade();
              });
            }
          }

          const startTime = performance.now();

          function step(now) {
            if (isFading !== "in") return;
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / FADE_DURATION);
            const factor = (1 - Math.cos(Math.PI * t)) / 2; // 0 up to 1 cosine ease
            const newVol = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * factor));
            lastSetVolume = newVol;
            media.volume = newVol;

            if (t < 1) {
              fadeAnimId = requestAnimationFrame(step);
            } else {
              media.volume = targetVol;
              lastSetVolume = targetVol;
              isFading = false;
              fadeAnimId = null;
            }
          }
          fadeAnimId = requestAnimationFrame(step);
        }

        if (media) {
          media.addEventListener("volumechange", () => {
            if (Math.abs(media.volume - lastSetVolume) > 0.001) {
              // Manual volume change by user
              cancelFade();
              baseVolume = media.volume;
              lastSetVolume = media.volume;
            }
          });

          media.addEventListener("play", () => {
            if (isFading && !programmaticStateChange) {
              cancelFade();
            }
          });

          media.addEventListener("pause", () => {
            if (isFading && !programmaticStateChange) {
              cancelFade();
            }
          });

          media.addEventListener("seeking", cancelFade);
          media.addEventListener("ended", cancelFade);
        }

        ["pick", "prev", "next", "shuffle", "stop"].forEach((id) => {
          document.getElementById(id)?.addEventListener("click", cancelFade);
        });

        setInterval(() => {
          if (!window.qON) return;
          if (!media || (!media.src && !media.currentSrc)) return;

          const x = 100 * Math.random();
          if (x < 25) {
            fadeInAndPlay();
          } else {
            fadeOutAndPause();
          }
        }, 60 * 1000);

        // Remove previous instance if it exists
        document.getElementById("qON-toggle")?.remove();

        window.qON = window.qON ?? true;

        const panel = document.createElement("div");
        panel.id = "qON-toggle";
        panel.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 2147483647;
          background: rgba(0,0,0,0.85);
          color: white;
          padding: 12px 16px;
          border-radius: 10px;
          font: bold 20px sans-serif;
          display: flex;
          align-items: center;
          gap: 12px;
          box-shadow: 0 4px 12px rgba(0,0,0,.4);
          user-select: none;
        `;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = window.qON;
        checkbox.style.cssText = `
          width: 32px;
          height: 32px;
          cursor: pointer;
        `;

        const label = document.createElement("span");

        function update() {
          window.qON = checkbox.checked;
          if (!window.qON) {
            cancelFade();
          }
          label.textContent = "RANDOM-PAUSE";
        }

        checkbox.addEventListener("change", update);
        update();

        panel.append(checkbox, label);
        document.body.appendChild(panel);
      })();
    </script>
  </body>
</html>
