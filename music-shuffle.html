<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Music Player</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 60px auto;
        padding: 20px;
        background: #111;
        color: #eee;
        text-align: center;
      }
      button {
        font-size: 16px;
        padding: 12px 20px;
        margin: 8px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      #pick {
        background: #4caf50;
        color: white;
      }
      #prev,
      #next {
        background: #2196f3;
        color: white;
      }
      #shuffle {
        background: #ff9800;
        color: white;
      }
      #stop {
        background: #e53935;
        color: white;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      audio {
        width: 100%;
        margin: 25px 0;
      }

      #track {
        margin: 20px 0;
        min-height: 24px;
        color: #aaa;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Random Music Player</h1>

    <button id="pick">Choose Music Folder</button>
    <button id="prev" disabled>⏮ Prev</button>
    <button id="next" disabled>⏭ Next</button>
    <button id="shuffle" disabled>🔀 Shuffle</button>
    <button id="stop" disabled>⏹ Stop</button>

    <audio id="player" controls></audio>

    <div id="track">No folder selected</div>
    <script src="music-shuffle.js"></script>
    <script>
      (() => {
        const $ = (sel) => document.querySelector(sel);

        setInterval(() => {
          if (window.qescape) return;

          const media = $("audio, video");
          if (!media) return;

          const x = 100 * Math.random();
          if (x < 25) {
            media.play().catch(() => {});
          } else {
            media.pause();
          }
        }, 60 * 1000);

        // Remove previous instance if it exists
        document.getElementById("qescape-toggle")?.remove();

        window.qescape = !!window.qescape;

        const panel = document.createElement("div");
        panel.id = "qescape-toggle";
        panel.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 2147483647;
          background: rgba(0,0,0,0.85);
          color: white;
          padding: 12px 16px;
          border-radius: 10px;
          font: bold 20px sans-serif;
          display: flex;
          align-items: center;
          gap: 12px;
          box-shadow: 0 4px 12px rgba(0,0,0,.4);
          user-select: none;
        `;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = window.qescape;
        checkbox.style.cssText = `
          width: 32px;
          height: 32px;
          cursor: pointer;
        `;

        const label = document.createElement("span");

        function update() {
          window.qescape = checkbox.checked;
          label.textContent = `qescape: ${window.qescape}`;
        }

        checkbox.addEventListener("change", update);
        update();

        panel.append(checkbox, label);
        document.body.appendChild(panel);
      })();
    </script>
  </body>
</html>
