<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Music Player</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 60px auto;
        padding: 20px;
        background: #111;
        color: #eee;
        text-align: center;
      }
      button {
        font-size: 16px;
        padding: 12px 20px;
        margin: 8px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      #pick {
        background: #4caf50;
        color: white;
      }
      #shuffle {
        background: #ff9800;
        color: white;
      }
      #stop {
        background: #e53935;
        color: white;
      }

      audio {
        width: 100%;
        margin: 25px 0;
      }

      #track {
        margin: 20px 0;
        min-height: 24px;
        color: #aaa;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Random Music Player</h1>

    <button id="pick">Choose Music Folder</button>
    <button id="shuffle" disabled>🔀 Shuffle</button>
    <button id="stop" disabled>⏹ Stop</button>

    <audio id="player" controls></audio>

    <div id="track">No folder selected</div>
    <script src="music-shuffle.js"></script>
  </body>
</html>
